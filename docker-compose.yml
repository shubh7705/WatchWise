services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watchwise_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_media:/app/media
      - backend_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/movies/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: watchwise_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_media:
    driver: local
  backend_data:
    driver: local
